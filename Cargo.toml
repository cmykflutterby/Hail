[workspace]
members = ["source/hail", "tests/hail-tests"]
default-members = ["source/hail"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
